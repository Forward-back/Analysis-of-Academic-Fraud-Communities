reason_mapping:
  version: "2.0-frozen"
  registry: "data/reference/mappings/reason_label_registry_v2.csv"
  domain_map: "data/reference/mappings/reason_domain_map_v2.csv"
  context_map: "data/reference/mappings/reason_context_map_v2.csv"
  analysis_family_map: "data/reference/mappings/analysis_family_domains_v2.csv"
  narrow_evidence_statuses:
    - substantive_finding
  broad_evidence_statuses:
    - substantive_finding
    - concern_allegation
    - error_unreliable
  reference_evidence_statuses:
    - error_unreliable
    - insufficient_information

reason_families:
  primary:
    - publication_process
    - image_integrity
    - plagiarism_authorship
  exploratory:
    - data_integrity
    - research_ethics_compliance
    - materials_methods_integrity
  reference:
    - error_control
  coverage:
    - unclassified

institution_tiers:
  rules:
    - start_year: 2012
      end_year: 2016
      primary_list: "985_211"
      sensitivity_list: "985_211"
    - start_year: 2017
      end_year: 2021
      primary_list: "double_first_class_2017"
      sensitivity_list: "985_211"
    - start_year: 2022
      end_year: 2025
      primary_list: "double_first_class_2022"
      sensitivity_list: "985_211"

geography:
  categories:
    - single_city
    - same_province_multi_city
    - domestic_cross_province
    - international
  separate_regions:
    - Hong Kong
    - Macao
    - Taiwan

matching:
  anchor_variables:
    - publication_year
    - source_id
    - work_type
  topic_fallback_order:
    - primary_topic
    - subfield
    - field
    - domain
  final_fallback:
    - publication_year
    - field
    - publisher

quality_gates:
  doi_match_warning: 0.75
  doi_match_exploratory_low: 0.60
  institution_complete_warning: 0.70
  funding_coverage_warning: 0.50
  exploratory_reason_family_min_doi: 1000

communities:
  primary_signal: "cross_paper_repeat_coauthorship_excess"
  min_papers: 5
  min_year_span: 2
  fixed_count: 25
